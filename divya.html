<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gim Edukasi IPAS Kelas 5 - Petualangan Anatomi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #74EBD5 0%, #9FACE6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            padding: 30px;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .input-group input {
            padding: 15px;
            border: 2px solid #9FACE6;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #74EBD5;
        }

        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Quiz Screen */
        .header-quiz {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            text-align: left;
        }

        .option:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option.selected {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .option.correct-reveal {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .option.wrong-reveal {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        #next-btn {
            background: #3b82f6;
            display: none;
        }
        #next-btn:hover {
            background: #2563eb;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: #f39c12;
            margin: 20px 0;
        }

        .btn-download {
            background: #9b59b6;
            margin-top: 20px;
        }

        .btn-download:hover {
            background: #8e44ad;
        }

        canvas {
            display: none; /* Hidden canvas for certificate generation */
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <h1>🌟 Petualangan Anatomi IPAS 🌟</h1>
        <p style="text-align: center; margin-bottom: 30px; color: #666;">Jawab 50 Tantangan Analisis (HOTS) tentang Sistem Tubuh Manusia!</p>
        <div class="input-group">
            <label for="player-name">Masukkan Nama Kamu:</label>
            <input type="text" id="player-name" placeholder="Contoh: Budi Santoso" autocomplete="off">
        </div>
        <button class="btn" onclick="startGame()">Mulai Bermain</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <div class="header-quiz">
            <span id="question-tracker">Soal 1 / 50</span>
            <span id="player-display"></span>
        </div>
        <div id="question-text" class="question-text">Teks Soal</div>
        <div id="options-container" class="options">
            <!-- Options injected by JS -->
        </div>
        <button id="next-btn" class="btn" onclick="nextQuestion()">Selanjutnya</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <div class="result-container">
            <h2>Selamat, <span id="final-name"></span>! 🎉</h2>
            <p>Kamu telah menyelesaikan misi petualangan anatomi tubuh manusia.</p>
            <div class="score-display" id="final-score">0</div>
            <p style="margin-bottom: 30px; color: #555;">Skor kamu dihitung dari persentase jawaban benar.</p>
            <button class="btn btn-download" onclick="downloadCertificate()">Unduh Sertifikat 🏆</button>
            <button class="btn" style="margin-top: 15px; background: #95a5a6;" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>
</div>

<canvas id="cert-canvas" width="800" height="600"></canvas>

    // --- GAME LOGIC ---
    let currentQuestionIndex = 0;
    let score = 0;
    let playerName = "";
    let correctAnswersCount = 0;
    let hasAnswered = false;

    // Elements
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const questionTracker = document.getElementById("question-tracker");
    const playerDisplay = document.getElementById("player-display");
    const nameInput = document.getElementById("player-name");

    function startGame() {
        const name = nameInput.value.trim();
        if(name === "") {
            alert("Harap masukkan nama kamu terlebih dahulu!");
            return;
        }
        playerName = name;
        playerDisplay.textContent = "Pemain: " + playerName;
        
        startScreen.classList.remove("active");
        quizScreen.classList.add("active");
        
        // Shuffle questions optional, but we keep sequential for structure
        showQuestion();
    }

    function showQuestion() {
        hasAnswered = false;
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";
        
        const qData = questions[currentQuestionIndex];
        questionTracker.textContent = `Soal ${currentQuestionIndex + 1} dari ${questions.length}`;
        questionText.textContent = qData.q;

        qData.options.forEach((opt, index) => {
            const btn = document.createElement("div");
            btn.classList.add("option");
            btn.textContent = String.fromCharCode(65 + index) + ". " + opt;
            btn.onclick = () => selectAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, btnElement) {
        if(hasAnswered) return; // Prevent multiple clicks
        hasAnswered = true;

        const qData = questions[currentQuestionIndex];
        const allOptions = optionsContainer.querySelectorAll(".option");

        // Reveal styling
        if(selectedIndex === qData.answer) {
            btnElement.classList.add("correct-reveal");
            correctAnswersCount++;
        } else {
            btnElement.classList.add("wrong-reveal");
            // Also show correct answer
            allOptions[qData.answer].classList.add("correct-reveal");
        }

        // Disable all options
        allOptions.forEach(opt => opt.style.cursor = "default");

        // Show Next button
        nextBtn.style.display = "block";
        if(currentQuestionIndex === questions.length - 1) {
            nextBtn.textContent = "Selesai & Lihat Hasil";
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if(currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        quizScreen.classList.remove("active");
        resultScreen.classList.add("active");

        // Calculate score (out of 100)
        score = Math.round((correctAnswersCount / questions.length) * 100);

        document.getElementById("final-name").textContent = playerName;
        document.getElementById("final-score").textContent = score;
    }

    function downloadCertificate() {
        const canvas = document.getElementById("cert-canvas");
        const ctx = canvas.getContext("2d");

        // Draw Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Border
        ctx.lineWidth = 15;
        ctx.strokeStyle = "#9FACE6";
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#74EBD5";
        ctx.strokeRect(35, 35, canvas.width - 70, canvas.height - 70);

        // Text Styles
        ctx.textAlign = "center";
        
        ctx.font = "bold 40px Arial";
        ctx.fillStyle = "#2c3e50";
        ctx.fillText("SERTIFIKAT PENGHARGAAN", canvas.width / 2, 150);

        ctx.font = "20px Arial";
        ctx.fillStyle = "#555";
        ctx.fillText("Diberikan dengan bangga kepada:", canvas.width / 2, 220);

        // Player Name
        ctx.font = "bold 45px Arial";
        ctx.fillStyle = "#3b82f6";
        ctx.fillText(playerName, canvas.width / 2, 280);
        
        // Underline name
        const textWidth = ctx.measureText(playerName).width;
        ctx.beginPath();
        ctx.moveTo((canvas.width / 2) - (textWidth / 2) - 20, 290);
        ctx.lineTo((canvas.width / 2) + (textWidth / 2) + 20, 290);
        ctx.strokeStyle = "#3b82f6";
        ctx.stroke();

        ctx.font = "20px Arial";
        ctx.fillStyle = "#555";
        ctx.fillText("Atas keberhasilannya menyelesaikan Gim Edukasi", canvas.width / 2, 350);
        ctx.fillText("Mata Pelajaran IPAS Kelas 5: Anatomi Tubuh Manusia", canvas.width / 2, 385);

        ctx.font = "bold 30px Arial";
        ctx.fillStyle = "#e67e22";
        ctx.fillText("Nilai Akhir: " + score + " / 100", canvas.width / 2, 460);

        ctx.font = "italic 16px Arial";
        ctx.fillStyle = "#999";
        const date = new Date().toLocaleDateString("id-ID", { year: 'numeric', month: 'long', day: 'numeric' });
        ctx.fillText("Diterbitkan pada: " + date, canvas.width / 2, 530);

        // Trigger Download
        const link = document.createElement("a");
        link.download = `Sertifikat_IPAS_${playerName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // Allow Enter key to start game
    nameInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            startGame();
        }
    });
